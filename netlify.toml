# Netlify configuration for Tommy's Tunes.
# Mostly a plain static HTML/CSS/JS site. One lightweight build step runs the
# page generator so the dynamic detail pages (team / services / packages) and
# the reviews page ship as real HTML with per-page titles, instead of empty JS
# shells that Google can't read. See scripts/generate.js and CLAUDE.md.
[build]
  command = "node scripts/generate.js"
  publish = "."

# Baseline security headers for every page and asset.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Caching. Netlify's default for everything here was
# "public, max-age=0, must-revalidate", so a returning visitor revalidated
# every image, script and the 3MB hero video on every single page view.
#
# Assets get a week. Deliberately not a year: filenames here are stable
# (basic_pf.jpg stays basic_pf.jpg when the photo behind it is replaced), so
# a long cache would leave people looking at the old picture. If you swap a
# photo and need it live immediately, change the filename and update the
# reference — otherwise it propagates within seven days.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# CSS and JS are not fingerprinted, so they get an hour rather than a week.
# Long enough to skip the round trip on a browsing session, short enough that
# a deploy reaches people the same morning.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Client forms (including the confidential credit card authorization form)
# stay downloadable for the office workflow, but should never appear in
# search results on their own.
[[headers]]
  for = "/assets/forms/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Old domains -> this one, as 301s.
#
# Netlify serves a domain alias as the site rather than redirecting it, so
# tommytunes.com and djtommystunes.com were answering 200 with a full copy of
# the site. Three domains serving identical pages is duplicate content, and it
# consolidates none of the ~1,850 referring domains those two carry, which was
# the entire reason for pointing them here. Only the www-of-the-primary case
# redirects on its own.
#
# An absolute URL in `from` is how Netlify scopes a rule to one hostname.
# force = true so these beat the static files that would otherwise be served.
[[redirects]]
  from = "https://tommytunes.com/*"
  to = "https://tommystunes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tommytunes.com/*"
  to = "https://tommystunes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://djtommystunes.com/*"
  to = "https://tommystunes.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.djtommystunes.com/*"
  to = "https://tommystunes.com/:splat"
  status = 301
  force = true

# Retired services: send old URLs to the services page.
[[redirects]]
  from = "/service/sax-violin-duo/*"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/service/multi-instrumentalist/*"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/service/front-board-screen/*"
  to = "/services.html"
  status = 301

# Team members no longer on the roster: send their old pages to the team page.
[[redirects]]
  from = "/person/victor/*"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/person/waldo/*"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/person/bobby/*"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/person/matt/*"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/person/ct/*"
  to = "/team.html"
  status = 301

# The old domain, tommytunes.com, carries about 858 referring domains from
# twenty years of listings, including bestoflongisland.com at DR 60 on its
# "Best Wedding DJ on Long Island" page. Those point at the old site's
# /main.html, which no longer exists. Once tommytunes.com's DNS points here,
# Netlify 301s the alias to this domain and keeps the path, so without this
# those links would land on a 404 and pass nothing.
# Add more old paths here as Search Console surfaces them.
[[redirects]]
  from = "/main.html"
  to = "/"
  status = 301

# The old Wix site had a packages brochure at /brochure; printed matter and
# old links still point there. Send them to the packages page.
[[redirects]]
  from = "/brochure"
  to = "/packages.html"
  status = 301

# The old Wix site's showcase page lived at /showcases (plural). Google still
# has that URL indexed, so it was serving a 404 to anyone arriving from search
# or an old link. Send it to the current page.
[[redirects]]
  from = "/showcases"
  to = "/showcase.html"
  status = 301

# Two more old Wix URLs still sitting in Google's index and serving 404s:
# the old venues page and the old unhyphenated music suggestions page.
[[redirects]]
  from = "/venue-affiliations"
  to = "/venues.html"
  status = 301

[[redirects]]
  from = "/musicsuggestions.html"
  to = "/music-suggestions.html"
  status = 301

# Internal files that must stay in the repo but should never be served:
# CLAUDE.md (read by Claude Code) and the build script. Return 404 publicly.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# The page templates live in /templates and are build inputs, not pages.
# Keep them out of search by sending any stray hit to the homepage.
[[redirects]]
  from = "/templates/*"
  to = "/"
  status = 301
  force = true

# Old bare-template paths (pre-build-step) redirect to the matching listing
# page. Generated pages live at /service/<slug>/, /person/<slug>/, etc.
[[redirects]]
  from = "/service.html"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/person.html"
  to = "/team.html"
  status = 301

[[redirects]]
  from = "/package.html"
  to = "/packages.html"
  status = 301

[[redirects]]
  from = "/reviews.html"
  to = "/reviews/"
  status = 301
