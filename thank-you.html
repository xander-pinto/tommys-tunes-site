<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

  <title>We got it · Tommy's Tunes</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">

  <style>
    .received {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-9) var(--container-pad);
      position: relative;
      overflow: hidden;
    }
    .received-mark {
      width: 64px;
      height: 64px;
      color: var(--electric-cyan);
      /* svg is display:block site-wide, so text-align won't center it */
      margin: 0 auto var(--sp-5);
    }
    .received a[href^="tel:"] { color: var(--electric-cyan); font-weight: 600; }
    .received h1 { margin-bottom: var(--sp-4); }
  </style>
</head>
<body>

  <div data-component="nav"></div>

  <section class="received">
    <div class="starfield"></div>
    <div style="position:relative; z-index:1; max-width: 620px;">
      <svg class="received-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="2" opacity="0.3"/>
        <path d="M15 24.5l6.5 6.5L33 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>We got it.</h1>
      <p style="margin-bottom: var(--sp-4);">
        Your request is in and we're checking availability now. Someone from our team will
        get back to you <strong>within one business day</strong> with options that fit your night.
      </p>
      <p style="margin-bottom: var(--sp-7);">
        If you'd rather just talk it through, call us at
        <a href="tel:6317325886">631-732-5886</a>.
      </p>
      <div style="display:flex; gap: var(--sp-3); justify-content:center; flex-wrap:wrap;">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-secondary" href="/showcase.html">See a real Long Island night</a>
      </div>
    </div>
  </section>

  <div data-component="footer"></div>
  <div data-component="modal"></div>

  <script src="/js/main.js" defer></script>
</body>
</html>
